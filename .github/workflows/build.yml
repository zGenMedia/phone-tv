# Builds and lints the APK on every push and pull request.
# GitHub's Ubuntu runners ship with the Android SDK (ANDROID_HOME is preset),
# so no SDK setup action is needed. CI has no access to the release key;
# artifacts here are debug-key signed. Official releases are signed locally.
name: Build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Build and lint
        run: ./gradlew --no-daemon assembleRelease lintRelease
      - uses: actions/upload-artifact@v5
        with:
          name: phone-tv-apk
          path: app/build/outputs/apk/release/*.apk
