# Builds the APK on every push and pull request.
# CI has no access to the release key, so artifacts here are signed with the
# standard debug key. Official releases are signed locally and attached to
# GitHub Releases.
name: Build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build and lint
        run: gradle --no-daemon assembleRelease lintRelease
      - uses: actions/upload-artifact@v4
        with:
          name: phone-tv-apk
          path: app/build/outputs/apk/release/*.apk
