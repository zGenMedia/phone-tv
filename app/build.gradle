plugins { id 'com.android.application' }

// Release signing is read from keystore.properties (not committed). Without it,
// builds fall back to the standard debug key so anyone can build and sideload.
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) keystorePropsFile.withInputStream { keystoreProps.load(it) }

android {
    namespace 'com.zgenmedia.tvhome'
    compileSdk 36

    defaultConfig {
        // NOTE: applicationId predates the Phone TV name. Changing it would make
        // Android treat new builds as a different app and break in-place updates.
        applicationId 'com.kinglifer.tvlauncher'
        // 25 = Android 7.1, which covers Fire OS 6 devices (Fire TV Stick 4K 1st gen, Cube)
        minSdk 25
        targetSdk 35
        versionCode 26
        versionName '0.13.0'
    }

    signingConfigs {
        if (keystorePropsFile.exists()) {
            zgen {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            if (keystorePropsFile.exists()) signingConfig signingConfigs.zgen
        }
        release {
            // The built-in player brings Media3; shrinking keeps the APK to the parts it uses.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropsFile.exists()) signingConfig signingConfigs.zgen
        }
    }

    buildFeatures { buildConfig true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        // UI strings live in res/values/strings.xml; remaining hits are format-only labels.
        disable 'SetTextI18n', 'OldTargetApi', 'ObsoleteSdkInt'
    }
}

dependencies {
    // The built-in player (optional to use: titles still hand off to Stremio, Nuvio or Plex).
    // Media3 is Google's own player library, the same engine Nuvio and most Android TV apps use.
    def media3 = '1.5.1'
    implementation "androidx.media3:media3-exoplayer:$media3"
    implementation "androidx.media3:media3-exoplayer-hls:$media3"
    implementation "androidx.media3:media3-exoplayer-dash:$media3"
}
